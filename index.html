<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detectives del Patio - Simulador Dengue</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; user-select: none; }
        body { background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* HUD Superior */
        #hud { width: 100%; max-width: 500px; padding: 15px; display: flex; justify-content: space-between; background: #333; font-size: 1.2rem; font-weight: bold; border-bottom: 3px solid #4CAF50; }
        .danger { color: #ff4d4d; animation: blink 1s infinite; }

        /* Escenario del Patio */
        #escenario { width: 100%; max-width: 500px; height: 75vh; background: #87CEEB; position: relative; border-bottom: 20px solid #8B4513; overflow: hidden; }
        #suelo { position: absolute; bottom: 0; width: 100%; height: 30%; background: #d3bfa7; border-top: 5px solid #6e473b; }

        /* Objetos Interactivos (Simulación con figuras para este prototipo) */
        .objeto { position: absolute; cursor: pointer; transition: transform 0.2s; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.8rem; font-weight: bold; border-radius: 8px; color: black; }
        .objeto:active { transform: scale(0.9); }

        /* Estilos de los Criaderos */
        #tambo { bottom: 25%; left: 10%; width: 70px; height: 90px; background: #0055ff; color: white; }
        #llanta { bottom: 10%; right: 15%; width: 80px; height: 40px; background: #333; color: white; border-radius: 20px; }
        #cubeta { bottom: 12%; left: 40%; width: 50px; height: 60px; background: #999; }
        #bebedero { bottom: 8%; left: 65%; width: 60px; height: 35px; background: #ffcc00; }

        /* Distractores (Errores) */
        .distractor { background: #8c8c8c; color: white; }
        #escoba { bottom: 25%; right: 40%; width: 30px; height: 100px; background: #cca37a; }
        #silla { bottom: 20%; right: 65%; width: 50px; height: 70px; background: #cc5200; }

        /* Estados Resueltos (Animación/Cambio) */
        .resuelto { pointer-events: none; opacity: 0.7; font-size: 0.7rem !important; }
        .tambo-tapa { background: #0033aa !important; border-top: 10px solid #000; }
        .llanta-tirada { transform: translateY(-500px) rotate(360deg) !important; opacity: 0; transition: all 0.8s ease-in; }
        .cubeta-volteada { transform: rotate(180deg) !important; background: #666 !important; }
        .bebedero-lavado { background: #fff !important; border: 2px solid #ffcc00; }

        /* Pantalla de Resultados */
        #pantalla-final { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        #pantalla-final h2 { font-size: 2rem; margin-bottom: 20px; }
        #mensaje { font-size: 1.2rem; margin-bottom: 30px; line-height: 1.5; max-width: 400px; }
        
        /* Botones */
        .btn { padding: 15px 30px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; text-decoration: none; color: white; margin: 10px; display: inline-block; }
        .btn-wa { background: #25D366; }
        .btn-reiniciar { background: #555; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="hud">
        <div>⏱️ Tiempo: <span id="timer">60</span>s</div>
        <div>🪰 Criaderos: <span id="contador">0</span>/4</div>
    </div>

    <div id="escenario">
        <div id="suelo"></div>

        <div id="tambo" class="objeto" onclick="resolver('tambo')">TAMBO<br>(Destapado)</div>
        <div id="llanta" class="objeto" onclick="resolver('llanta')">LLANTA<br>VIEJA</div>
        <div id="cubeta" class="objeto" onclick="resolver('cubeta')">CUBETA<br>AGUA</div>
        <div id="bebedero" class="objeto" onclick="resolver('bebedero')">PLATO<br>PERRO</div>

        <div id="escoba" class="objeto distractor" onclick="errorMecanica()">ESCOBA</div>
        <div id="silla" class="objeto distractor" onclick="errorMecanica()">SILLA</div>
    </div>

    <div id="pantalla-final">
        <h2 id="resultado-titulo"></h2>
        <p id="mensaje"></p>
        <a id="btn-share" class="btn btn-wa" href="#" target="_blank">Retar a mis vecinos en WhatsApp 💬</a>
        <button class="btn btn-reiniciar" onclick="location.reload()">Volver a intentar 🔄</button>
    </div>

    <script>
        let tiempo = 60;
        let aciertos = 0;
        const totalCriaderos = 4;
        let juegoTerminado = false;

        // Cronómetro
        const countdown = setInterval(() => {
            if (juegoTerminado) return;
            tiempo--;
            document.getElementById('timer').innerText = tiempo;

            if (tiempo <= 10) {
                document.getElementById('timer').classList.add('danger');
            }

            if (tiempo <= 0) {
                document.getElementById('timer').innerText = 0;
                finalizarJuego(false);
            }
        }, 1000);

        // Lógica de Aciertos (Regla de prevención)
        function resolver(id) {
            if (juegoTerminado) return;
            let obj = document.getElementById(id);
            if (obj.classList.contains('resuelto')) return;

            obj.classList.add('resuelto');
            aciertos++;
            document.getElementById('contador').innerText = aciertos;

            // Animación y cambios visuales específicos
            if (id === 'tambo') {
                obj.innerHTML = "¡TAPADO!";
                obj.classList.add('tambo-tapa');
            } else if (id === 'llanta') {
                obj.innerHTML = "¡TIRADA!";
                obj.classList.add('llanta-tirada');
            } else if (id === 'cubeta') {
                obj.innerHTML = "¡VOLTEADA!";
                obj.classList.add('cubeta-volteada');
            } else if (id === 'bebedero') {
                obj.innerHTML = "¡LAVADO!";
                obj.classList.add('bebedero-lavado');
            }

            // Validar si ya ganó
            if (aciertos === totalCriaderos) {
                finalizarJuego(true);
            }
        }

        // Lógica de Error (Distractores)
        function errorMecanica() {
            if (juegoTerminado) return;
            
            // Penalización de tiempo
            tiempo = Math.max(0, tiempo - 5);
            document.getElementById('timer').innerText = tiempo;
            
            // Alerta visual rápida (Rojo en el fondo del escenario)
            let escenario = document.getElementById('escenario');
            escenario.style.backgroundColor = '#ffcccc';
            setTimeout(() => { escenario.style.backgroundColor = '#87CEEB'; }, 200);
        }

        // Fin de la partida
        function finalizarJuego(gano) {
            juegoTerminado = true;
            clearInterval(countdown);
            
            const pantalla = document.getElementById('pantalla-final');
            const titulo = document.getElementById('resultado-titulo');
            const mensaje = document.getElementById('mensaje');
            const btnShare = document.getElementById('btn-share');
            
            let tiempoEmpleado = 60 - tiempo;

            if (gano) {
                titulo.innerText = "🏆 ¡Felicidades, Detective del Patio!";
                titulo.style.color = "#4CAF50";
                mensaje.innerText = `Encontraste los criaderos en ${tiempoEmpleado} segundos. En la vida real, este recorrido te toma solo 10 minutos el fin de semana. Mantén a tu familia a salvo del dengue.`;
            } else {
                titulo.innerText = "❌ El tiempo terminó";
                titulo.style.color = "#ff4d4d";
                mensaje.innerText = "Te faltó revisar bien el patio. Recuerda: bastan unas gotas de agua limpia para que el mosquito ponga sus huevos. En la vida real, un solo descuido pone en riesgo a tu familia.";
            }

            // Configurar enlace dinámico de WhatsApp
            let textoWhatsApp = encodeURIComponent(`Acabo de limpiar mi patio virtual en el juego del Dengue y protegí a mi familia. ¿Tú qué tan limpio tienes tu patio? Juega aquí: ${window.location.href}`);
            btnShare.href = `https://api.whatsapp.com/send?text=${textoWhatsApp}`;

            pantalla.style.display = "flex";
        }
    </script>
</body>
</html>

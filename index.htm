<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detectives del Patio - Edición Realista</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; user-select: none; }
        
        body { 
            background: #121212; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        
        /* HUD Estilo App Moderna */
        #hud { 
            width: 100%; 
            max-width: 450px; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            background: rgba(30, 30, 30, 0.9); 
            font-size: 1.1rem; 
            font-weight: bold; 
            border-bottom: 4px solid #2e7d32;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .danger { color: #d32f2f; animation: blink 0.8s infinite; }

        /* El Patio Real (Contenedor) */
        #escenario { 
            width: 100%; 
            max-width: 450px; 
            height: 75vh; 
            /* AQUÍ VA TU FOTO DE FONDO: Puedes cambiar este enlace por la foto de un patio real */
            background: url('https://images.unsplash.com/photo-1590012314607-cda9d9b6a9a9?q=80&w=600') center center / cover no-repeat; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
        }

        /* Capa de Flash Rojo para Errores */
        #flash-error {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: rgba(211, 47, 47, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 4;
        }

        /* Objetos con Imágenes Reales (.png transparentes) */
        .objeto { 
            position: absolute; 
            cursor: pointer; 
            transition: transform 0.2s ease, opacity 0.5s ease;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 2;
        }
        .objeto:active { transform: scale(0.95); }

        /* Colocación de Criaderos (Simulados con imágenes reales de internet) */
        #tambo { 
            bottom: 18%; left: 8%; width: 90px; height: 130px; 
            background-image: url('https://img.icons8.com/plasticine/200/barrel.png'); /* Reemplazar por tambo azul real */
        }
        #llanta { 
            bottom: 5%; right: 5%; width: 110px; height: 80px; 
            background-image: url('https://img.icons8.com/plasticine/200/tyre.png'); /* Reemplazar por llanta sucia real */
        }
        #cubeta { 
            bottom: 8%; left: 42%; width: 70px; height: 85px; 
            background-image: url('https://img.icons8.com/plasticine/200/bucket.png'); /* Reemplazar por cubeta con agua */
        }

        /* Distractores Reales */
        #escoba { 
            bottom: 15%; right: 40%; width: 45px; height: 145px; 
            background-image: url('https://img.icons8.com/plasticine/200/broom.png'); 
        }

        /* Efectos Visuales de "Desactivación" */
        .resuelto { pointer-events: none; }
        
        /* Animación: El tambo ahora se le nota una tapa encima */
        .tambo-tapado { 
            filter: drop-shadow(0px 0px 10px #4CAF50);
        }
        /* Animación: La llanta sale volando hacia el camión */
        .llanta-eliminada { 
            transform: translateY(-600px) rotate(180deg) scale(0.1) !important; 
            opacity: 0; 
        }
        /* Animación: La cubeta se gira por completo */
        .cubeta-volteada { 
            transform: rotate(150deg) translateY(30px) !important; 
            filter: grayscale(50%);
        }

        /* Pantalla de Resultados Elegante */
        #pantalla-final { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(10, 10, 10, 0.98); 
            z-index: 10; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 30px; 
            text-align: center; 
        }
        #pantalla-final h2 { font-size: 2.2rem; margin-bottom: 15px; font-weight: 800; }
        #mensaje { font-size: 1.1rem; margin-bottom: 35px; line-height: 1.6; max-width: 380px; color: #ccc; }
        
        /* Botones Acción Colectiva */
        .btn { padding: 16px 32px; font-size: 1.05rem; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; text-decoration: none; color: white; margin: 8px; width: 85%; max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
        .btn-wa { background: #128C7E; transition: background 0.3s; }
        .btn-wa:hover { background: #25D366; }
        .btn-reiniciar { background: #333; color: #eee; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="hud">
        <div>⏱️ <span id="timer">60</span>s</div>
        <div>🪰 Criaderos: <span id="contador">0</span> / 3</div>
    </div>

    <div id="escenario">
        <div id="flash-error"></div>

        <div id="tambo" class="objeto" onclick="resolver('tambo')"></div>
        <div id="llanta" class="objeto" onclick="resolver('llanta')"></div>
        <div id="cubeta" class="objeto" onclick="resolver('cubeta')"></div>

        <div id="escoba" class="objeto" onclick="errorMecanica()"></div>
    </div>

    <div id="pantalla-final">
        <h2 id="resultado-titulo"></h2>
        <p id="mensaje"></p>
        <a id="btn-share" class="btn btn-wa" href="#" target="_blank">Retar a mis vecinos en WhatsApp 💬</a>
        <button class="btn btn-reiniciar" onclick="location.reload()">Jugar de nuevo 🔄</button>
    </div>

    <script>
        let tiempo = 60;
        let aciertos = 0;
        const totalCriaderos = 3;
        let juegoTerminado = false;

        const countdown = setInterval(() => {
            if (juegoTerminado) return;
            tiempo--;
            document.getElementById('timer').innerText = tiempo;
            if (tiempo <= 10) document.getElementById('timer').classList.add('danger');
            if (tiempo <= 0) {
                document.getElementById('timer').innerText = 0;
                finalizarJuego(false);
            }
        }, 1000);

        function resolver(id) {
            if (juegoTerminado) return;
            let obj = document.getElementById(id);
            if (obj.classList.contains('resuelto')) return;

            obj.classList.add('resuelto');
            aciertos++;
            document.getElementById('contador').innerText = aciertos;

            // Cambios físicos realistas
            if (id === 'tambo') {
                obj.classList.add('tambo-tapado');
                // Simulamos que le cae una tapa encima cambiando la imagen
                obj.style.backgroundImage = "url('https://img.icons8.com/plasticine/200/checked-checkbox.png')"; 
            } else if (id === 'llanta') {
                obj.classList.add('llanta-eliminada');
            } else if (id === 'cubeta') {
                obj.classList.add('cubeta-volteada');
            }

            if (aciertos === totalCriaderos) finalizarJuego(true);
        }

        function errorMecanica() {
            if (juegoTerminado) return;
            tiempo = Math.max(0, tiempo - 5);
            document.getElementById('timer').innerText = tiempo;
            
            let flash = document.getElementById('flash-error');
            flash.style.opacity = "1";
            setTimeout(() => { flash.style.opacity = "0"; }, 150);
        }

        function finalizarJuego(gano) {
            juegoTerminado = true;
            clearInterval(countdown);
            
            const pantalla = document.getElementById('pantalla-final');
            const titulo = document.getElementById('resultado-titulo');
            const mensaje = document.getElementById('mensaje');
            const btnShare = document.getElementById('btn-share');
            let tiempoEmpleado = 60 - tiempo;

            if (gano) {
                titulo.innerText = "🏆 ¡Excelente Inspector!";
                titulo.style.color = "#81c784";
                mensaje.innerText = `Limpiaste el patio en ${tiempoEmpleado} segundos. En la vida real, eliminar estos criaderos te toma menos de 10 minutos a la semana. ¡Protege a tu familia del dengue!`;
            } else {
                titulo.innerText = "❌ El tiempo expiró";
                titulo.style.color = "#e57373";
                mensaje.innerText = "Te faltaron lugares críticos por revisar. Recuerda que el mosquito del dengue busca cualquier agua estancada limpia para reproducirse.";
            }

            let textoWhatsApp = encodeURIComponent(`Acabo de limpiar mi patio virtual contra el Dengue en ${tiempoEmpleado}s. ¿Tú qué tan limpio tienes el tuyo? Rétame aquí: ${window.location.href}`);
            btnShare.href = `https://api.whatsapp.com/send?text=${textoWhatsApp}`;
            pantalla.style.display = "flex";
        }
    </script>
</body>
</html>

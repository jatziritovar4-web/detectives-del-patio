<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cazadores de Criaderos - Edición Animada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; user-select: none; }
        
        body { 
            background: #1e251f; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        
        /* HUD Superior */
        #hud { 
            width: 100%; 
            max-width: 450px; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            background: #2e3830; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-bottom: 4px solid #4CAF50;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 5;
        }
        .danger { color: #ff4d4d; animation: blink 0.8s infinite; }

        /* Escenario del Patio (Ilustración estilo Vector/Dibujo de patio típico) */
        #escenario { 
            width: 100%; 
            max-width: 450px; 
            height: 75vh; 
            /* Fondo de patio plano / Ilustración limpia */
            background: #e0f2f1; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-bottom: 16px solid #8d6e63; /* Suelo rústico de dibujo */
        }

        /* Pared del patio dibujada (barda) */
        #barda {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 70%;
            background: #b0bec5; /* Muro gris de block */
            border-bottom: 8px solid #78909c;
        }

        /* Capa de Flash Rojo para Errores */
        #flash-error {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: rgba(244, 67, 54, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            z-index: 4;
        }

        /* Objetos Estilo Dibujo / Vector */
        .objeto { 
            position: absolute; 
            cursor: pointer; 
            transition: transform 0.3s ease, opacity 0.4s ease;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 2;
        }
        .objeto:active { transform: scale(0.9); }

        /* Criaderos en formato Dibujo (Usando íconos vectoriales limpios) */
        #tambo { 
            bottom: 12%; left: 8%; width: 85px; height: 120px; 
            background-image: url('https://img.icons8.com/flat-round/200/water-barrel.png'); 
        }
        #llanta { 
            bottom: 3%; right: 6%; width: 100px; height: 70px; 
            background-image: url('https://img.icons8.com/flat-round/200/car-wheel.png'); 
            filter: grayscale(30%);
        }
        #cubeta { 
            bottom: 4%; left: 40%; width: 70px; height: 80px; 
            background-image: url('https://img.icons8.com/flat-round/200/bucket.png'); 
        }

        /* Distractores de Dibujo */
        #escoba { 
            bottom: 18%; right: 42%; width: 45px; height: 130px; 
            background-image: url('https://img.icons8.com/flat-round/200/broom.png'); 
        }

        /* Efectos de la regla de las 4 palabras */
        .resuelto { pointer-events: none; }
        .tambo-tapado { filter: drop-shadow(0 0 10px #4CAF50); }
        .llanta-tirada { transform: translateY(-700px) rotate(270deg) scale(0.2) !important; opacity: 0; }
        .cubeta-volteada { transform: rotate(180deg) translateY(-20px) !important; }

        /* Los Mosquitos Volando (Dibujos CSS) */
        .mosquito {
            position: absolute;
            width: 24px;
            height: 24px;
            background-image: url('https://img.icons8.com/color/96/mosquito.png'); /* Dibujo de mosquito */
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none; /* No estorban al hacer clic en los objetos */
            z-index: 3;
            transition: left 1s linear, top 1s linear; /* Movimiento suave */
        }

        /* Pantalla Final Directa y Madura */
        #pantalla-final { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(18, 24, 19, 0.96); 
            z-index: 10; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 25px; 
            text-align: center; 
        }
        #pantalla-final h2 { font-size: 2rem; margin-bottom: 15px; font-weight: bold; }
        #mensaje { font-size: 1.1rem; margin-bottom: 30px; line-height: 1.5; max-width: 380px; color: #e0e0e0; }
        
        .btn { padding: 16px 32px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; text-decoration: none; color: white; margin: 8px; width: 85%; max-width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
        .btn-wa { background: #25D366; }
        .btn-reiniciar { background: #424242; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="hud">
        <div>⏱️ <span id="timer">60</span>s</div>
        <div>🦟 Criaderos: <span id="contador">0</span> / 3</div>
    </div>

    <div id="escenario">
        <div id="barda"></div>
        <div id="flash-error"></div>

        <div id="tambo" class="objeto" onclick="resolver('tambo')"></div>
        <div id="llanta" class="objeto" onclick="resolver('llanta')"></div>
        <div id="cubeta" class="objeto" onclick="resolver('cubeta')"></div>

        <div id="escoba" class="objeto" onclick="errorMecanica()"></div>
    </div>

    <div id="pantalla-final">
        <h2 id="resultado-titulo"></h2>
        <p id="mensaje"></p>
        <a id="btn-share" class="btn btn-wa" href="#" target="_blank">Retar a vecinos en WhatsApp 💬</a>
        <button class="btn btn-reiniciar" onclick="location.reload()">Jugar de nuevo 🔄</button>
    </div>

    <script>
        let tiempo = 60;
        let aciertos = 0;
        const totalCriaderos = 3;
        let juegoTerminado = false;

        // Iniciar reloj
        const countdown = setInterval(() => {
            if (juegoTerminado) return;
            tiempo--;
            document.getElementById('timer').innerText = tiempo;
            if (tiempo <= 10) document.getElementById('timer').classList.add('danger');
            if (tiempo <= 0) {
                document.getElementById('timer').innerText = 0;
                finalizarJuego(false);
            }
        }, 1000);

        // Crear los mosquitos voladores
        const escenario = document.getElementById('escenario');
        const numMosquitos = 6;
        const listaMosquitos = [];

        for (let i = 0; i < numMosquitos; i++) {
            let mosca = document.createElement('div');
            mosca.className = 'mosquito';
            // Posición inicial aleatoria
            mosca.style.left = Math.random() * 80 + '%';
            mosca.style.top = Math.random() * 60 + '%';
            escenario.appendChild(mosca);
            listaMosquitos.push(mosca);
        }

        // Mover los mosquitos de dibujo por el patio cada segundo
        setInterval(() => {
            if (juegoTerminado) return;
            listaMosquitos.forEach(mosca => {
                let x = Math.random() * 85;
                let y = Math.random() * 65;
                mosca.style.left = x + '%';
                mosca.style.top = y + '%';
            });
        }, 1000);

        // Lógica al tocar un criadero verdadero
        function resolver(id) {
            if (juegoTerminado) return;
            let obj = document.getElementById(id);
            if (obj.classList.contains('resuelto')) return;

            obj.classList.add('resuelto');
            aciertos++;
            document.getElementById('contador').innerText = aciertos;

            if (id === 'tambo') {
                obj.classList.add('tambo-tapado');
                obj.style.backgroundImage = "url('https://img.icons8.com/flat-round/200/checkmark.png')"; // Icono de tapado/ok
            } else if (id === 'llanta') {
                obj.classList.add('llanta-tirada');
            } else if (id === 'cubeta') {
                obj.classList.add('cubeta-volteada');
            }

            if (aciertos === totalCriaderos) finalizarJuego(true);
        }

        // Lógica al tocar un distractor (Silla/Escoba)
        function errorMecanica() {
            if (juegoTerminado) return;
            tiempo = Math.max(0, tiempo - 5);
            document.getElementById('timer').innerText = tiempo;
            
            let flash = document.getElementById('flash-error');
            flash.style.opacity = "1";
            setTimeout(() => { flash.style.opacity = "0"; }, 100);
        }

        function finalizarJuego(gano) {
            juegoTerminado = true;
            clearInterval(countdown);
            
            // Quitar los mosquitos al ganar/perder
            document.querySelectorAll('.mosquito').forEach(m => m.remove());

            const pantalla = document.getElementById('pantalla-final');
            const titulo = document.getElementById('resultado-titulo');
            const mensaje = document.getElementById('mensaje');
            const btnShare = document.getElementById('btn-share');
            let tiempoEmpleado = 60 - tiempo;

            if (gano) {
                titulo.innerText = "🏆 ¡Felicidades, Detective!";
                titulo.style.color = "#81c784";
                mensaje.innerText = `Encontraste y eliminaste los criaderos en ${tiempoEmpleado} segundos. En la vida real, este recorrido te toma solo 10 minutos el fin de semana. Mantén a tu familia a salvo del dengue.`;
            } else {
                titulo.innerText = "❌ El tiempo terminó";
                titulo.style.color = "#e57373";
                mensaje.innerText = "Te faltó revisar objetos. Recuerda: bastan unas gotas de agua estancada para que el mosquito ponga sus huevos. En la vida real, un solo descuido pone en riesgo a tus hijos o padres.";
            }

            let textoWhatsApp = encodeURIComponent(`¡Acabo de limpiar mi patio virtual del Dengue en ${tiempoEmpleado} segundos! ¿Tú qué tan limpio tienes tu patio? Juega aquí: ${window.location.href}`);
            btnShare.href = `https://api.whatsapp.com/send?text=${textoWhatsApp}`;
            pantalla.style.display = "flex";
        }
    </script>
</body>
</html>

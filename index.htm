<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detectives del Patio - Versión Completa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; user-select: none; }
        
        body { 
            background: #1e251f; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        
        /* HUD Superior */
        #hud { 
            width: 100%; 
            max-width: 480px; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            background: #2e3830; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-bottom: 4px solid #4CAF50;
            z-index: 5;
        }
        .danger { color: #ff4d4d; animation: blink 0.8s infinite; }

        /* El Patio Ilustrado (Fondo y dimensiones) */
        #escenario { 
            width: 100%; 
            max-width: 480px; 
            height: 75vh; 
            background: #e0f2f1; /* Cielo/Fondo claro de dibujo */
            position: relative; 
            overflow: hidden; 
            border-bottom: 25px solid #8d6e63; /* Suelo de tierra/cemento */
        }

        #barda {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 65%;
            background: #b0bec5; /* Pared de bloque gris dibujada */
            border-bottom: 6px solid #78909c;
        }

        /* Efecto de pantalla roja al equivocarse */
        #flash-error {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: rgba(244, 67, 54, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            z-index: 4;
        }

        /* Estilo base de los Dibujos */
        .objeto { 
            position: absolute; 
            cursor: pointer; 
            transition: all 0.4s ease;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 2;
        }
        .objeto:active { transform: scale(0.9); }

        /* --- LOS 6 CRIADEROS (DIBUJOS) --- */
        #tambo { bottom: 15%; left: 4%; width: 80px; height: 110px; background-image: url('https://img.icons8.com/flat-round/200/water-barrel.png'); }
        #lavadero { bottom: 12%; left: 24%; width: 90px; height: 95px; background-image: url('https://img.icons8.com/external-icongeek26-flat-icongeek26/128/external-sink-cleaning-icongeek26-flat-icongeek26.png'); }
        #cubeta { bottom: 4%; left: 48%; width: 60px; height: 70px; background-image: url('https://img.icons8.com/flat-round/200/bucket.png'); }
        #bebedero { bottom: 2%; left: 68%; width: 55px; height: 45px; background-image: url('https://img.icons8.com/color/144/dog-bowl.png'); }
        #maceta { bottom: 8%; right: 4%; width: 65px; height: 75px; background-image: url('https://img.icons8.com/flat-round/200/potted-plant.png'); }
        #llanta { bottom: 25%; right: 2%; width: 85px; height: 65px; background-image: url('https://img.icons8.com/flat-round/200/car-wheel.png'); filter: grayscale(40%); }

        /* --- LOS DISTRACTORES (TRUCOS) --- */
        #escoba { bottom: 18%; left: 42%; width: 35px; height: 110px; background-image: url('https://img.icons8.com/flat-round/200/broom.png'); }
        #silla { bottom: 10%; right: 28%; width: 55px; height: 80px; background-image: url('https://img.icons8.com/color/144/chair.png'); }
        #caja { bottom: 4%; left: 16%; width: 50px; height: 50px; background-image: url('https://img.icons8.com/color/144/cardboard-box.png'); }

        /* --- ANIMACIONES SATISFACTORIAS AL TOCARLOS --- */
        .resuelto { pointer-events: none; }
        
        /* TAPA: Aparece una lona/tapa verde encima */
        .tambo-tapado { filter: drop-shadow(0 0 8px #4CAF50); background-image: url('https://img.icons8.com/flat-round/200/checkmark.png') !important; }
        /* TIRA: Sale volando hacia arriba simulando que va al camión */
        .llanta-tirada { transform: translateY(-600px) rotate(360deg) scale(0.1) !important; opacity: 0; }
        /* VOLTEA: Se gira de cabeza de inmediato */
        .cubeta-volteada { transform: rotate(180deg) translateY(-15px) !important; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.3)); }
        /* LAVA: Efecto de brillo/limpieza blanca */
        .lavado-esponja { filter: brightness(1.3) drop-shadow(0 0 10px #00bcd4); }

        /* Mosquitos Volando en Dibujo */
        .mosquito {
            position: absolute;
            width: 20px; height: 20px;
            background-image: url('https://img.icons8.com/color/96/mosquito.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 3;
            transition: left 0.8s linear, top 0.8s linear;
        }

        /* Pantallas de Cierre Modura y Directa */
        #pantalla-final { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 20, 16, 0.97); 
            z-index: 10; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 25px; 
            text-align: center; 
        }
        #pantalla-final h2 { font-size: 2rem; margin-bottom: 15px; font-weight: bold; }
        #mensaje { font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; max-width: 400px; }
        
        .btn { padding: 16px 32px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; text-decoration: none; color: white; margin: 8px; width: 85%; max-width: 320px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-wa { background: #25D366; }
        .btn-reiniciar { background: #424242; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="hud">
        <div>⏱️ <span id="timer">60</span>s</div>
        <div>🦟 Criaderos: <span id="contador">0</span> / 6</div>
    </div>

    <div id="escenario">
        <div id="barda"></div>
        <div id="flash-error"></div>

        <div id="tambo" class="objeto" onclick="resolver('tambo', 'tapa')"></div>
        <div id="llanta" class="objeto" onclick="resolver('llanta', 'tira')"></div>
        <div id="cubeta" class="objeto" onclick="resolver('cubeta', 'voltea')"></div>
        <div id="lavadero" class="objeto" onclick="resolver('lavadero', 'lava')"></div>
        <div id="bebedero" class="objeto" onclick="resolver('bebedero', 'lava')"></div>
        <div id="maceta" class="objeto" onclick="resolver('maceta', 'lava')"></div>

        <div id="escoba" class="objeto" onclick="errorMecanica()"></div>
        <div id="silla" class="objeto" onclick="errorMecanica()"></div>
        <div id="caja" class="objeto" onclick="errorMecanica()"></div>
    </div>

    <div id="pantalla-final">
        <h2 id="resultado-titulo"></h2>
        <p id="mensaje"></p>
        <a id="btn-share" class="btn btn-wa" href="#" target="_blank">Retar a mis vecinos en WhatsApp 💬</a>
        <button class="btn btn-reiniciar" onclick="location.reload()">Volver a intentar 🔄</button>
    </div>

    <script>
        let tiempo = 60;
        let aciertos = 0;
        const totalCriaderos = 6;
        let juegoTerminado = false;

        // Cronómetro de 60 segundos
        const countdown = setInterval(() => {
            if (juegoTerminado) return;
            tiempo--;
            document.getElementById('timer').innerText = tiempo;
            if (tiempo <= 10) document.getElementById('timer').classList.add('danger');
            if (tiempo <= 0) {
                document.getElementById('timer').innerText = 0;
                finalizarJuego(false);
            }
        }, 1000);

        // Generar Mosquitos Volando en Dibujo
        const patio = document.getElementById('escenario');
        const moscas = [];
        for (let i = 0; i < 7; i++) {
            let m = document.createElement('div');
            m.className = 'mosquito';
            m.style.left = Math.random() * 80 + '%';
            m.style.top = Math.random() * 60 + '%';
            patio.appendChild(m);
            moscas.push(m);
        }

        setInterval(() => {
            if (juegoTerminado) return;
            moscas.forEach(m => {
                m.style.left = Math.random() * 85 + '%';
                m.style.top = Math.random() * 65 + '%';
            });
        }, 900);

        // Mecánica Point & Click aplicando la regla de prevención
        function resolver(id, accion) {
            if (juegoTerminado) return;
            let obj = document.getElementById(id);
            if (obj.classList.contains('resuelto')) return;

            obj.classList.add('resuelto');
            aciertos++;
            document.getElementById('contador').innerText = aciertos;

            // Animaciones directas y satisfactorias
            if (accion === 'tapa') {
                obj.classList.add('tambo-tapado');
            } else if (accion === 'tira') {
                obj.classList.add('llanta-tirada');
            } else if (accion === 'voltea') {
                obj.classList.add('cubeta-volteada');
            } else if (accion === 'lava') {
                obj.classList.add('lavado-esponja');
            }

            if (aciertos === totalCriaderos) finalizarJuego(true);
        }

        // Si da clic en un distractor: Sonido visual (BEEP) y -5 segundos
        function errorMecanica() {
            if (juegoTerminado) return;
            tiempo = Math.max(0, tiempo - 5);
            document.getElementById('timer').innerText = tiempo;
            
            // Sonido sintético del navegador (BEEP)
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}

            let flash = document.getElementById('flash-error');
            flash.style.opacity = "1";
            setTimeout(() => { flash.style.opacity = "0"; }, 120);
        }

        // Mensajes del Cierre Psicológico
        function finalizarJuego(gano) {
            juegoTerminado = true;
            clearInterval(countdown);
            document.querySelectorAll('.mosquito').forEach(m => m.remove());

            const pantalla = document.getElementById('pantalla-final');
            const titulo = document.getElementById('resultado-titulo');
            const mensaje = document.getElementById('mensaje');
            const btnShare = document.getElementById('btn-share');
            let tiempoEmpleado = 60 - tiempo;

            if (gano) {
                titulo.innerText = "🏆 ¡Felicidades, eres un Detective del Patio!";
                titulo.style.color = "#4CAF50";
                mensaje.innerText = `Encontraste los 6 criaderos en ${tiempoEmpleado} segundos. En la vida real, este recorrido te toma solo 10 minutos el fin de semana. Mantén a tu familia a salvo del dengue.`;
            } else {
                titulo.innerText = "❌ El tiempo terminó";
                titulo.style.color = "#ff4d4d";
                mensaje.innerText = "Te faltó revisar el plato debajo de la maceta o el lavadero. Recuerda: bastan unas gotas de agua limpia para que el mosquito ponga sus huevos. En la vida real, un solo descuido pone en riesgo a tus hijos o padres.";
            }

            let textoWhatsApp = encodeURIComponent(`Acabo de limpiar mi patio virtual en ${tiempoEmpleado}s en el juego del Dengue. ¿Tú qué tan limpio tienes tu patio? Juega aquí: ${window.location.href}`);
            btnShare.href = `https://api.whatsapp.com/send?text=${textoWhatsApp}`;
            pantalla.style.display = "flex";
        }
    </script>
</body>
</html>

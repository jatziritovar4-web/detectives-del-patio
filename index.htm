<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detectives del Patio - Edición Patio Realista</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; user-select: none; }
        
        body { 
            background: #111412; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        
        /* HUD Superior */
        #hud { 
            width: 100%; 
            max-width: 480px; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            background: #252c26; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-bottom: 4px solid #4CAF50;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .danger { color: #ff4d4d; animation: blink 0.8s infinite; }

        /* ESCENARIO PATIO CON PROFUNDIDAD */
        #escenario { 
            width: 100%; 
            max-width: 480px; 
            height: 75vh; 
            /* Cielo al fondo con degradado de tarde/mañana */
            background: linear-gradient(to bottom, #87CEEB, #e0f7fa); 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 0 40px rgba(0,0,0,0.1);
        }

        /* Barda de bloques con textura lineal */
        #barda {
            position: absolute;
            top: 25%; left: 0; width: 100%; height: 50%;
            background: #90a4ae; 
            background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 20px;
            border-top: 8px solid #78909c;
            border-bottom: 12px solid #546e7a;
        }

        /* Suelo de cemento con perspectiva */
        #suelo {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 25%;
            background: linear-gradient(to bottom, #757575, #424242);
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
        }

        /* Efecto pantalla roja por error */
        #flash-error {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: rgba(244, 67, 54, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            z-index: 4;
        }

        /* CONTENEDOR BASE DE OBJETOS VECTORIALES */
        .objeto { 
            position: absolute; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }
        .objeto svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }
        .objeto:active { transform: scale(0.85); }

        /* UBICACIONES Y TAMAÑOS EN EL PATIO */
        #tambo { bottom: 16%; left: 4%; width: 75px; height: 100px; }
        #lavadero { bottom: 20%; left: 24%; width: 90px; height: 90px; }
        #cubeta { bottom: 4%; left: 45%; width: 55px; height: 60px; }
        #bebedero { bottom: 2%; left: 68%; width: 55px; height: 35px; }
        #maceta { bottom: 15%; right: 4%; width: 65px; height: 80px; }
        #llanta { bottom: 6%; right: 22%; width: 75px; height: 65px; }

        /* DISTRACTORES */
        #escoba { bottom: 22%; left: 42%; width: 30px; height: 95px; }
        #silla { bottom: 14%; right: 42%; width: 55px; height: 80px; }
        #caja { bottom: 5%; left: 18%; width: 50px; height: 45px; }

        /* MECÁNICAS Y ANIMACIONES DE LAS 4 PALABRAS */
        .resuelto { pointer-events: none; }
        
        /* TAPA: El tambo cambia de color y muestra un borde verde de éxito */
        .tambo-tapado { filter: drop-shadow(0 0 12px #4CAF50) !important; }
        /* TIRA: La llanta sale disparada de la pantalla simulando que va al camión */
        .llanta-tirada { transform: translateY(-700px) rotate(450deg) scale(0.1) !important; opacity: 0; }
        /* VOLTEA: La cubeta gira de cabeza al instante */
        .cubeta-volteada { transform: rotate(180deg) translateY(-10px) !important; filter: drop-shadow(0 -4px 6px rgba(0,0,0,0.2)); }
        /* LAVA: Destello cian de limpieza */
        .lavado-esponja { filter: brightness(1.2) drop-shadow(0 0 15px #00bcd4); animation: pulso 0.5s ease; }

        /* Mosquitos animados */
        .mosquito {
            position: absolute;
            width: 22px; height: 22px;
            pointer-events: none;
            z-index: 3;
            transition: left 0.8s linear, top 0.8s linear;
        }

        /* Pantalla Final */
        #pantalla-final { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 20, 16, 0.98); 
            z-index: 10; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 25px; 
            text-align: center; 
        }
        #pantalla-final h2 { font-size: 2rem; margin-bottom: 15px; font-weight: bold; }
        #mensaje { font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; max-width: 400px; }
        
        .btn { padding: 16px 32px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; text-decoration: none; color: white; margin: 8px; width: 85%; max-width: 320px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-wa { background: #25D366; }
        .btn-reiniciar { background: #424242; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes pulso { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="hud">
        <div>⏱️ <span id="timer">60</span>s</div>
        <div>🦟 Criaderos: <span id="contador">0</span> / 6</div>
    </div>

    <div id="escenario">
        <div id="barda"></div>
        <div id="suelo"></div>
        <div id="flash-error"></div>

        <div id="tambo" class="objeto" onclick="resolver('tambo', 'tapa')">
            <svg viewBox="0 0 64 64" id="svg-tambo">
                <ellipse cx="32" cy="12" rx="20" ry="6" fill="#0d47a1"/>
                <path d="M12,12 C12,12 12,52 32,52 C52,52 52,12 52,12" fill="#1565c0"/>
                <ellipse cx="32" cy="12" rx="16" ry="4" fill="#0a2540"/>
            </svg>
        </div>

        <div id="lavadero" class="objeto" onclick="resolver('lavadero', 'lava')">
            <svg viewBox="0 0 64 64">
                <rect x="8" y="16" width="48" height="24" rx="4" fill="#cfd8dc"/>
                <rect x="14" y="22" width="20" height="12" fill="#b0bec5"/>
                <rect x="38" y="22" width="12" height="12" fill="#78909c"/>
                <path d="M24,8 L24,16 M22,8 L26,8" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <div id="cubeta" class="objeto" onclick="resolver('cubeta', 'voltea')">
            <svg viewBox="0 0 64 64">
                <path d="M16,16 L48,16 L42,52 L22,52 Z" fill="#78909c"/>
                <ellipse cx="32" cy="16" rx="16" ry="4" fill="#4f5b62"/>
                <ellipse cx="32" cy="16" rx="14" ry="3" fill="#00b0ff"/> </svg>
        </div>

        <div id="bebedero" class="objeto" onclick="resolver('bebedero', 'lava')">
            <svg viewBox="0 0 64 64">
                <path d="M8,44 C8,28 56,28 56,44 Z" fill="#e53935"/>
                <ellipse cx="32" cy="36" rx="16" ry="5" fill="#00b0ff"/>
            </svg>
        </div>

        <div id="maceta" class="objeto" onclick="resolver('maceta', 'lava')">
            <svg viewBox="0 0 64 64">
                <path d="M20,12 Q32,0 44,12 Q48,24 32,32 Q16,24 20,12 Z" fill="#4caf50"/> <path d="M16,32 L48,32 L42,56 L22,56 Z" fill="#ff9800"/> <rect x="14" y="56" width="36" height="4" rx="2" fill="#d84315"/> </svg>
        </div>

        <div id="llanta" class="objeto" onclick="resolver('llanta', 'tira')">
            <svg viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="26" fill="#37474f"/>
                <circle cx="32" cy="32" r="14" fill="#e0f2f1"/> <circle cx="32" cy="32" r="20" fill="none" stroke="#263238" stroke-width="3" stroke-dasharray="6,4"/>
            </svg>
        </div>

        <div id="escoba" class="objeto" onclick="errorMecanica()">
            <svg viewBox="0 0 64 64">
                <rect x="30" y="4" width="4" height="44" rx="2" fill="#ffb74d"/>
                <path d="M16,48 L48,48 L44,60 L20,60 Z" fill="#f4511e"/>
            </svg>
        </div>

        <div id="silla" class="objeto" onclick="errorMecanica()">
            <svg viewBox="0 0 64 64">
                <path d="M16,16 L16,40 L48,40 L48,16" fill="none" stroke="#d84315" stroke-width="4"/>
                <rect x="12" y="40" width="40" height="4" fill="#bf360c"/>
                <rect x="16" y="44" width="4" height="16" fill="#d84315"/>
                <rect x="44" y="44" width="4" height="16" fill="#d84315"/>
            </svg>
        </div>

        <div id="caja" class="objeto" onclick="errorMecanica()">
            <svg viewBox="0 0 64 64">
                <rect x="10" y="16" width="44" height="36" rx="2" fill="#bcaaa4"/>
                <path d="M10,16 L32,28 L54,16" fill="none" stroke="#8d6e63" stroke-width="3"/>
            </svg>
        </div>
    </div>

    <div id="pantalla-final">
        <h2 id="resultado-titulo"></h2>
        <p id="mensaje"></p>
        <a id="btn-share" class="btn btn-wa" href="#" target="_blank">Retar a mis vecinos en WhatsApp 💬</a>
        <button class="btn btn-reiniciar" onclick="location.reload()">Volver a intentar 🔄</button>
    </div>

    <script>
        let tiempo = 60;
        let aciertos = 0;
        const totalCriaderos = 6;
        let juegoTerminado = false;

        // Cronómetro
        const countdown = setInterval(() => {
            if (juegoTerminado) return;
            tiempo--;
            document.getElementById('timer').innerText = tiempo;
            if (tiempo <= 10) document.getElementById('timer').classList.add('danger');
            if (tiempo <= 0) {
                document.getElementById('timer').innerText = 0;
                finalizarJuego(false);
            }
        }, 1000);

        // Mosquitos vectoriales volando (Hechos con mini-SVG dinámicos)
        const patio = document.getElementById('escenario');
        const moscas = [];
        for (let i = 0; i < 6; i++) {
            let m = document.createElement('div');
            m.className = 'mosquito';
            m.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="#000"/><path d="M6,10 Q12,2 11,12 M18,10 Q12,2 13,12" fill="#81d4fa" opacity="0.7"/></svg>`;
            m.style.left = Math.random() * 80 + '%';
            m.style.top = Math.random() * 50 + '%';
            patio.appendChild(m);
            moscas.push(m);
        }

        setInterval(() => {
            if (juegoTerminado) return;
            moscas.forEach(m => {
                m.style.left = Math.random() * 85 + '%';
                m.style.top = Math.random() * 55 + '%';
            });
        }, 800);

        // Acción Point & Click aplicando la regla de prevención
        function resolver(id, accion) {
            if (juegoTerminado) return;
            let obj = document.getElementById(id);
            if (obj.classList.contains('resuelto')) return;

            obj.classList.add('resuelto');
            aciertos++;
            document.getElementById('contador').innerText = aciertos;

            if (accion === 'tapa') {
                obj.classList.add('tambo-tapado');
                // Modifica el SVG del tambo para ponerle una tapa lona verde encima
                document.getElementById('svg-tambo').innerHTML = `
                    <ellipse cx="32" cy="12" rx="22" ry="7" fill="#2e7d32"/>
                    <path d="M12,12 C12,12 12,52 32,52 C52,52 52,12 52,12" fill="#1565c0" opacity="0.6"/>
                    <text x="20" y="38" fill="#4CAF50" font-size="26" font-weight="bold">✓</text>
                `;
            } else if (accion === 'tira') {
                obj.classList.add('llanta-tirada');
            } else if (accion === 'voltea') {
                obj.classList.add('cubeta-volteada');
            } else if (accion === 'lava') {
                obj.classList.add('lavado-esponja');
            }

            if (aciertos === totalCriaderos) finalizarJuego(true);
        }

        // Penalizaciones por distractores
        function errorMecanica() {
            if (juegoTerminado) return;
            tiempo = Math.max(0, tiempo - 5);
            document.getElementById('timer').innerText = tiempo;
            
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}

            let flash = document.getElementById('flash-error');
            flash.style.opacity = "1";
            setTimeout(() => { flash.style.opacity = "0"; }, 120);
        }

        // Cierre Psicológico Directo
        function finalizarJuego(gano) {
            juegoTerminado = true;
            clearInterval(countdown);
            document.querySelectorAll('.mosquito').forEach(m => m.remove());

            const pantalla = document.getElementById('pantalla-final');
            const titulo = document.getElementById('resultado-titulo');
            const mensaje = document.getElementById('mensaje');
            const btnShare = document.getElementById('btn-share');
            let tiempoEmpleado = 60 - tiempo;

            if (gano) {
                titulo.innerText = "🏆 ¡Felicidades, eres un Detective del Patio!";
                titulo.style.color = "#4CAF50";
                mensaje.innerText = `Encontraste y desactivaste los 6 criaderos en ${tiempoEmpleado} segundos. En la vida real, este recorrido te toma solo 10 minutos el fin de semana. Mantén a tu familia a salvo del dengue.`;
            } else {
                titulo.innerText = "❌ El tiempo terminó";
                titulo.style.color = "#ff4d4d";
                mensaje.innerText = "Te faltó revisar bien el patio. Recuerda: bastan unas gotas de agua estancada limpia para que el mosquito ponga sus huevos. En la vida real, un solo descuido pone en riesgo a tus hijos o padres.";
            }

            let textoWhatsApp = encodeURIComponent(`Acabo de limpiar mi patio virtual en ${tiempoEmpleado}s en el juego del Dengue y protegí a mi familia. ¿Tú qué tan limpio tienes tu patio? Juega aquí: ${window.location.href}`);
            btnShare.href = `https://api.whatsapp.com/send?text=${textoWhatsApp}`;
            pantalla.style.display = "flex";
        }
    </script>
</body>
</html>
